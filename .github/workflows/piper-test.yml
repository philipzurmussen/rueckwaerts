name: Piper-Hörproben
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['piper-test/generate.py']
concurrency: piper-test
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install piper-tts
      - run: python piper-test/generate.py
      - name: Ergebnisse einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A piper-test/audio piper-test/manifest.json
          git commit -m "Piper-Hörproben erzeugt" || echo "nichts zu committen"
          git pull --rebase origin main
          git push
